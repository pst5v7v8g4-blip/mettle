<!DOCTYPE html>
<html lang="en" data-theme="forge">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Mettle</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--r:10px;--r2:14px;--sp:8px;
--disp:"Avenir Next Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
--body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;}
[data-theme=forge]{--bg:#12161c;--bg2:#161b22;--card:#1b222c;--card2:#212a36;--line:#2b3542;--ink:#e9e4d8;--mut:#95a0ad;--acc:#e8833a;--accd:#a85a24;--gold:#d3a94f;--good:#63b073;--bad:#d6685a;--info:#7fa6d9;--lockc:#8fa3bf;--scrim:rgba(6,8,11,.62)}
[data-theme=slate]{--bg:#10141b;--bg2:#141924;--card:#192130;--card2:#1f2a3c;--line:#2a3850;--ink:#e4e9f2;--mut:#8fa0b8;--acc:#6ea8fe;--accd:#3f6db3;--gold:#d3a94f;--good:#63b073;--bad:#d6685a;--info:#9db7dd;--lockc:#8fa3bf;--scrim:rgba(5,8,14,.62)}
[data-theme=paper]{--bg:#f2efe8;--bg2:#eae6dd;--card:#ffffff;--card2:#f7f4ec;--line:#d8d2c4;--ink:#22262c;--mut:#6b7280;--acc:#b45f22;--accd:#8a4517;--gold:#8f6f22;--good:#2f7d43;--bad:#b03a2e;--info:#33608f;--lockc:#5c6b80;--scrim:rgba(30,28,22,.45)}
[data-theme=terminal]{--bg:#0b100d;--bg2:#0e1511;--card:#121a15;--card2:#17211b;--line:#22352a;--ink:#d7ead9;--mut:#7fa08a;--acc:#7ce38b;--accd:#3f8f4e;--gold:#cbd37a;--good:#7ce38b;--bad:#e0705f;--info:#8fd0c7;--lockc:#79a08e;--scrim:rgba(3,8,5,.66)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
html{background:var(--bg)}body{margin:0;background:transparent;color:var(--ink);font:16px/1.5 var(--body);touch-action:manipulation;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
h1,h2,h3{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:0 0 .4em}
h1{font-size:22px}h2{font-size:17px;color:var(--ink)}h3{font-size:14px;color:var(--mut)}
.eyebrow{font-family:var(--disp);text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--mut)}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-size:30px;font-weight:700}
.mut{color:var(--mut)}.good{color:var(--good)}.bad{color:var(--bad)}.acc{color:var(--acc)}.gold{color:var(--gold)}
small{font-size:12px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* header */
header{position:sticky;top:0;z-index:40;background:linear-gradient(var(--bg2),var(--bg2));border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.hrow{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.brand{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:.12em;text-transform:uppercase}
.brand b{color:var(--acc)}
.gauge{flex:1;min-width:120px}
.gauge .bar{display:flex;gap:2px;height:14px}
.gauge .seg{flex:1;background:var(--line);border-radius:2px}
.gauge .seg.on{background:var(--acc)}
.gauge .seg.ib{background:var(--info)}
.glabel{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);font-family:var(--mono);margin-top:2px}
.cdown{text-align:right;line-height:1.15}
.cdown .num{font-size:19px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;max-width:1100px;margin-left:auto;margin-right:auto}
.chip{font-size:11px;font-family:var(--disp);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--mut);background:var(--card)}
.chip.on{color:var(--acc);border-color:var(--acc)}
.chip.warn{color:var(--bad);border-color:var(--bad)}
/* nav */
nav{position:sticky;top:0;z-index:39;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:2px;padding:6px 8px;max-width:1100px;margin:0 auto}
.tab{white-space:nowrap;min-height:44px;padding:10px 14px;border:0;background:none;color:var(--mut);font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:13px;border-radius:8px;cursor:pointer}
.tab:active{background:var(--card2)}
.tab.on{color:var(--ink);background:var(--card);box-shadow:inset 0 -2px 0 var(--acc)}
main{max-width:1100px;margin:0 auto;padding:14px 12px 90px}
.grid{display:grid;gap:12px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g32{grid-template-columns:2fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px}
.card h2{margin-top:0}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:0}
.btn{min-height:44px;padding:10px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#161006}
[data-theme=paper] .btn.pri{color:#fff}
.btn.ghost{background:none}
.btn.sm{min-height:34px;padding:6px 10px;font-size:12px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%}
textarea{min-height:80px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline>*{width:auto}
.pill{display:inline-block;font-size:11px;font-family:var(--mono);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--mut);margin:2px 4px 2px 0}
.pill.acc{color:var(--acc);border-color:var(--accd)}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.gold{color:var(--gold);border-color:var(--gold)}
.lockg{color:var(--lockc);font-family:var(--mono);font-size:11px;border:1px solid var(--lockc);border-radius:4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--mut);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc)}
.bar>i.info{background:var(--info)}.bar>i.good{background:var(--good)}.bar>i.gold{background:var(--gold)}
progress{width:100%}
/* calendar */
.cal-month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{background:var(--bg2);border:1px solid var(--line);border-radius:8px;min-height:64px;padding:4px 5px;font-size:11px;position:relative}
.cal-cell.today{border-color:var(--acc)}
.cal-cell.seam{box-shadow:inset 0 0 0 1px var(--gold)}
.cal-cell .d{font-family:var(--mono);color:var(--mut)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin:1px}
.dot.class{background:var(--info)}.dot.study{background:#b48ade}.dot.gym{background:var(--good)}.dot.skill{background:var(--acc)}.dot.social{background:var(--gold)}.dot.faith{background:#e6c9f0}.dot.work{background:#7dd3c8}.dot.exam{background:var(--bad)}
.wk{display:grid;grid-template-columns:44px repeat(7,1fr);gap:2px;font-size:11px}
.wk .col{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:6px;min-height:640px}
.wk .hrs{position:relative}
.wk .hl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);color:var(--mut);font-family:var(--mono);font-size:9px;padding-left:2px}
.blk{position:absolute;left:2px;right:2px;border-radius:5px;padding:2px 4px;overflow:hidden;font-size:10px;line-height:1.2;border:1px solid transparent}
.blk.class{background:rgba(127,166,217,.22);border-color:var(--info)}
.blk.study{background:rgba(180,138,222,.18);border-color:#b48ade}
.blk.gym{background:rgba(99,176,115,.18);border-color:var(--good)}
.blk.skill{background:rgba(232,131,58,.18);border-color:var(--acc)}
.blk.social{background:rgba(211,169,79,.18);border-color:var(--gold)}
.blk.faith{background:rgba(230,201,240,.16);border-color:#caa8d8}
.blk.work{background:rgba(125,211,200,.16);border-color:#7dd3c8}
.blk.exam{background:rgba(214,104,90,.22);border-color:var(--bad)}
.blk.soft{opacity:.75;border-style:dashed}
/* heatmap */
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:2px}
.hm i{width:11px;height:11px;border-radius:2px;background:var(--line)}
.hm i.l1{background:var(--accd)}.hm i.l2{background:var(--acc)}.hm i.l3{background:var(--gold)}
/* skills */
.skl{border:1px solid var(--line);border-radius:var(--r2);padding:12px;background:var(--card)}
.skl.active{border-color:var(--acc)}
.skl .name{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:15px}
.tier{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.tier:last-child{border-bottom:0}
.tier .tick{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--bg2);cursor:pointer}
.tier.done .tick{background:var(--good);border-color:var(--good);color:#0d1a10}
.tier.done .tn{text-decoration:line-through;color:var(--mut)}
.play{background:var(--bg2);border-left:3px solid var(--accd);border-radius:6px;padding:8px 10px;font-size:12.5px;margin-top:8px}
.ring-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.legend{font-size:11px;color:var(--mut)}
.legend b{color:var(--ink);font-weight:600}
/* modal & toast */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:80;padding:12px}
@media(min-width:640px){.scrim{align-items:center}}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:var(--card2);border:1px solid var(--acc);color:var(--ink);padding:10px 16px;border-radius:10px;z-index:99;font-size:14px;max-width:92vw}
.banner{border:1px solid var(--gold);background:var(--card2);border-radius:var(--r2);padding:12px;margin-bottom:12px}
.banner.warn{border-color:var(--bad)}
.banner.info{border-color:var(--info)}
/* pin */
#pin{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
#pin[hidden]{display:none}
.pinbox{max-width:340px;width:100%;text-align:center}
.pinbox input{text-align:center;font-family:var(--mono);font-size:24px;letter-spacing:.5em}
.qa-pass{color:var(--good)}.qa-fail{color:var(--bad)}.qa-man{color:var(--mut)}
.svgc{width:100%;height:auto;display:block}
.gantt-row{display:flex;align-items:center;gap:8px;font-size:12px;margin:4px 0}
.gantt-track{flex:1;height:14px;background:var(--bg2);border:1px solid var(--line);border-radius:4px;position:relative}
.gantt-bar{position:absolute;top:1px;bottom:1px;background:var(--accd);border-radius:3px}
.matrix td{text-align:center;font-family:var(--mono);font-size:12px}
.matrix .h1{background:rgba(232,131,58,.15)}.matrix .h2{background:rgba(232,131,58,.35)}.matrix .h3{background:rgba(232,131,58,.6)}
.spec pre{white-space:pre-wrap;font-size:12px;font-family:var(--mono);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;max-height:70vh;overflow:auto}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--bg2)}
summary{cursor:pointer;font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;color:var(--mut);min-height:32px;display:flex;align-items:center}
.klist{display:flex;flex-direction:column;gap:10px}
.searchbar{position:sticky;top:0;background:var(--bg);padding:4px 0;z-index:5}
.tag{font-size:10px;border-radius:4px;padding:1px 5px;background:var(--bg2);border:1px solid var(--line);color:var(--mut);font-family:var(--mono)}
.xpbar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold)}
.empty{color:var(--mut);text-align:center;padding:22px;font-size:14px;border:1px dashed var(--line);border-radius:12px}

.tlrow{display:flex;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px dashed var(--line);font-size:13px;cursor:pointer;min-height:36px}
.tlrow:last-child{border-bottom:0}
.tlt{width:46px;color:var(--mut);flex:none}
.tlb{flex:1}
.tls{width:20px;text-align:center;color:var(--good)}
.tlcur{background:var(--card2);border-left:3px solid var(--acc);border-radius:6px}
.tldone .tlb{color:var(--mut);text-decoration:line-through}
.tlskip .tlb{color:var(--mut);opacity:.55}
.nowcard{background:var(--card);border:1px solid var(--acc);border-radius:var(--r2);padding:16px}
.nowbig{border:0;max-width:560px;width:100%;margin:auto}
#nowfs{position:fixed;inset:0;background:var(--bg);z-index:70;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.fcard{perspective:1000px;cursor:pointer;margin-top:8px}
.fcin{position:relative;transition:transform .35s;transform-style:preserve-3d;min-height:160px}
.fcard.flipped .fcin{transform:rotateY(180deg)}
.fcface{position:absolute;inset:0;backface-visibility:hidden;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:16px}
.fcback{transform:rotateY(180deg);border-color:var(--acc);font-size:14px}
.fcsm{margin:8px 0}.fcsm .fcin{min-height:110px}.fcsm .fcface{font-size:13.5px;padding:12px}
@media(prefers-reduced-motion:reduce){.fcin{transition:none}}

.bigbtn{display:block;width:100%;padding:18px;font-size:20px;border-radius:14px;margin-bottom:12px;text-align:center}
.lnk{text-decoration:none}
.albrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.ratechip{cursor:pointer}
.physthumb{width:64px;height:64px;object-fit:cover;border-radius:8px;margin:3px;border:1px solid var(--line)}

.habrow{display:flex;gap:6px;align-items:center}
body::before{content:'';position:fixed;inset:-40%;z-index:-1;background:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--acc) 14%,transparent),transparent 45%),radial-gradient(circle at 80% 70%,color-mix(in srgb,var(--gold,#d4a017) 10%,transparent),transparent 40%);animation:mflow 26s ease-in-out infinite alternate;pointer-events:none}
@keyframes mflow{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.06)}}
@media (prefers-reduced-motion: reduce){body::before{animation:none}}
</style>

const SPEC_MD="# METTLE \u2014 Master Build Specification v1.0\nGenerated 2026-08-19 \u00b7 Companion file: `mettle-skills.json` (import verbatim, do not retype)\n\n## 0. PROMPT TO USE\nPaste this spec + attach `mettle-skills.json`, then say:\n> **Build Mettle exactly per this spec as a single self-contained HTML file. Import mettle-skills.json verbatim as the skills database. Follow the Build Order in \u00a714. Before finishing, verify every item in the Acceptance Checklist (\u00a715) and print the checklist with pass/fail. Embed a condensed copy of this spec in the hidden Spec tab (\u00a713).**\n\n---\n\n## 1. WHAT METTLE IS\nA single-user life operating system for a Penn junior: skill acquisition tracker + weekly scheduler + academics + IB-prep engine + body/nutrition + money + faith/family/social \u2014 gamified, honest, and self-documenting. **Stage 1** (this build): one HTML file, runs locally, offline, free. **Stage 2** (later): same data model deployed to Vercel + Supabase free tier for sync, hosted .ics, and a second login for a friend.\n\nDesign principles: honest numbers over motivation theater \u00b7 nothing shames, everything re-plans \u00b7 every feature earns its screen space \u00b7 the app can rebuild itself (spec rides inside it).\n\n## 2. USER PROFILE & BASELINES (seed as `profile`)\n- Rising junior, Wharton, concentrations Finance + AI. Lives in a house just off campus (has kitchen, can host).\n- **IB internship secured**: The Sage Group, LA, June 2027 start. Goal = **return offer** (not interviews). Technicals + Excel currently ~zero.\n- Body: 5'10.5\" (179 cm), 165 lb (down from 190). Bench 275\u2013280 (295 historic; 225 done), squat 225\u00d74, deadlift <315 (failed attempt). Mile ~5:00, marathon finished (5:05), 400m now 59\u201360s (sub-52 in HS). Strong swimmer.\n- Chess ~1400 bullet / ~1100 blitz. Typing 57 WPM. Cube rusty (~90s once re-learned). Guitar: open chords + fingerstyle, no barre. Spanish: forgotten HS level (dad fluent). **Two semesters of Malagasy completed.**\n- Catholic; St. Agatha\u2013St. James, Sunday 11:30 Mass. Calls mother + sister weekly (goal).\n- Devices: iPhone + Apple Watch; lifts logged in Hevy/Flex AI (no API \u2014 CSV import optional later); has Excel.\n- Sleep targets: **1:00 AM bed / 9:30 AM wake**. Wind-down nudge 12:45 AM.\n- Money: DoorDash (foot now; bike decision open), work-study (cap 20 hr/wk in session), target **$500/mo**, ladder to **$100k by end-2028** (show honest gap), skill budget **$20/mo typical, $50 max \u2014 adjustable slider**.\n- This year = **strength + speed**; endurance era (sub-3 marathon, 50mi, 100mi) is `scheduled-future` 2027+.\n- Six life goals for radar mapping: GPA 3.8 \u00b7 IB return offer \u00b7 Body (180 lean, lifts) \u00b7 Social \u00b7 $100k \u00b7 Faith+Family.\n\n## 3. ARCHITECTURE & STORAGE CONTRACT\n- **F-A1** Single self-contained HTML file. No external network calls, no CDNs, no build step. All CSS/JS inline. Charts are hand-rolled inline SVG.\n- **F-A2** Persistence: `localStorage` wrapped in try/catch \u2192 if unavailable, run in-memory and banner-prompt \"Export JSON before closing.\" Autosave on every mutation (debounced 500ms). Key: `mettle_v1`.\n- **F-A3** **Versioned schema**: root `{schemaVersion: 1, profile, skills, equipment, schedule, courses, tasks, logs, decks, settings, ...}`. Migration function stub `migrate(data)` switches on version.\n- **F-A4** **Tolerant importer**: unknown fields preserved untouched; missing fields defaulted; never crash on import. Import merges by `id` with \"replace / keep / duplicate\" prompt on conflicts.\n- **F-A5** **Export/Import JSON** (full state, pretty-printed, filename `mettle-backup-YYYY-MM-DD.json`). This is the Stage-2 migration path and the \"major redesign\" path: export JSON + paste Spec-tab contents into any model \u2192 regenerate app \u2192 import.\n- **F-A6** **Password lock**: 4\u20138 digit PIN gate on open. Store SHA-256 hash. Honest label in settings: \"local privacy screen, not encryption \u2014 data lives in this browser.\"\n- **F-A7** **.ics generator**: button builds `mettle.ics` containing fixed class blocks, gym blocks, tasks with datetimes, and reminders \u2014 each VEVENT gets `VALARM` (default -PT30M; -PT15M for wind-down). Honest note in UI: \"Import into Google Calendar for iPhone alerts. Re-download + re-import after schedule changes (Stage 2 gives a live subscribe URL).\"\n- **F-A8** Fully offline; degrade nothing without network.\n- **F-A9** **Hidden Spec tab** (\u00a713) reachable via Settings \u2192 \"About Mettle\" \u2192 tap logo 5\u00d7.\n- **F-A10** Mobile-first responsive (he'll use it on iPhone); dark theme default + theme picker (**F-G8**).\n- **F-A11** All dates America/New_York. \"Today\" logic respects that.\n\n## 4. DATA MODEL (minimum schemas \u2014 extend as needed)\n```\nprofile{name, heightCm:179, weightLb, dobYear, phase, sleepTarget{bed:\"01:00\",wake:\"09:30\"}, budgetMonthly:20, budgetMax:50, tradeCapReal:50, tradeCapOriginal:15}\nskill  \u2192 per mettle-skills.json + runtime {done, doneDate, evidence[], actualHours, log[]}\ncourse{id, code, title, days[], start, end, quarter:\"Q1\"|\"Q2\"|\"FULL\", cu, instructor, pcr{diff,work,qual}, multiplier, attendanceLock:bool, addDropCalendar:\"UG\"|\"WQ\"|\"MBA\"}\nassignment{id, courseId, title, due, estHrs, done} \u00b7 exam{id, courseId, date, eveBlockHrs, backplanned:bool}\nevent{id, title, start, end, type, locked:bool} \u2014 drop-ins\ntask{id, title, due, recurrence, module, done}\nweightLog{date, lb} \u00b7 liftLog{date, lift, weight, reps} \u2014 or Hevy CSV import\nfoodLog{date, kcal, protein, carbs, fat, water} \u00b7 sleepLog{date, bed, wake} + showeredAfterGym:bool on gym sessions\nmoneyLog{date, stream, start, end, gross, orders, mode:\"foot\"|\"bike\"} \u00b7 purchase{date, item, cost, category}\ntrade{date, kind:\"stock\"|\"option\", paper:bool, thesis, entry, exit, rules{thesisWritten,sizeOk,stopSet,noRevenge}, score, pnl}\ncontact{name, kind:\"finance\"|\"general\", metAt, lastTouch, nextFollowUp} \u00b7 eventLog{date, name, kind}\nalbum{date, artist, title, note, pairedWith} \u00b7 movie{date, title, with}\ndeck{id, name, cards[{front, back, ef:2.5, interval:0, reps:0, due}]}\nstreak{id, count, lastDate, freezesUsedThisMonth:0} \u00b7 badge{id, earnedDate} \u00b7 reflection{date, promptId, text}\nsettings{theme, pin, mode:\"SEMESTER\"|\"BREAK\", travel:\"PENN\"|\"HOME_BREAK\"|\"SUMMER_SAGE_LA\", injury:bool, supervisionToggles{}, ankiNoteSeen}\n```\n\n## 5. SCHEDULING ENGINE\n- **F-S1 Quarter-aware base week.** Two stored grids; **auto-swap Oct 15, 2026** with a 7-day advance banner. Q1\u2192Q2 seam visually marked on calendar.\n- **F-S2 Hours-remaining counter** (header, always visible): free discretionary hours left this week = 168 \u2212 sleep(8.5\u00d77) \u2212 classes \u2212 study(computed \u00a77) \u2212 locked blocks \u2212 logged/planned activities. Weekly discretionary budget \u2248 **25h skills+social + 4\u20136h IB prep** \u2014 show both remaining.\n- **F-S3 Drop-in events**: add anything (party, review session); engine re-plans the week, flags displaced items instead of silently dropping them.\n- **F-S4 Conflict detector** \u2014 three classes: (a) time overlap; (b) **training conflicts** from pair table \u00a712.7 (e.g. cut\u27f7PR attempt, heavy-pull day\u27f7climbing same/next day, high-mileage\u27f7heavy legs <48h); (c) **budget conflicts** (activation cost > remaining monthly budget).\n- **F-S5 \"What can I do right now?\"** button: inputs = minutes free (auto from calendar or manual), current location (Penn/house/Pottruck/home), equipment on hand \u2192 ranked list of active/backlog items that fit, with tier you'd work on.\n- **F-S6 Modes**: SEMESTER vs BREAK (break: classes vanish, home-only equipment unlocks: guitar, golf, drone, sew kit, car skills, lobster).\n- **F-S7 Travel mode**: PENN (default) / HOME_BREAK / SUMMER_SAGE_LA (June 2027 preset: capacity minimal, IB live, skills maintenance-only).\n- **F-S8 Injury/illness mode**: pauses athletic streaks penalty-free, hides athletic suggestions, offers mind/craft roster swaps.\n- **F-S9 4-week capacity forecast**: bar per week, exams and locked events subtract; shows crunch before it hits.\n- **F-S10 Sunk-window detector**: any recurring free block \u226590 min unused 3+ consecutive weeks \u2192 surfaced with a suggestion matched by location/equipment.\n- **F-S11 Opportunity-cost preview**: activating a skill shows \"\u2248X hrs/wk from [named windows], pushes [items] back ~Y weeks.\"\n- **F-S12 Calendar views** month/week/day, color-coded by category (class/study/gym/skill/social/faith/work/sleep), **locked blocks** (MGMT 1110, exams, Mass) rendered with a lock glyph and non-negotiable in re-planning.\n\n## 6. WEEKLY GRIDS (seed exactly)\n**Q1 (Aug 25 \u2013 Oct 14)**\n| Day | Fixed |\n|---|---|\n| Mon | MGMT 3010 1:45\u20133:14 \u00b7 LGST 2910 3:30\u20136:29 \u00b7 Chess Club 8\u201310pm (soft) |\n| Tue | FNCE 1010 10:15\u201311:44 \u00b7 MGMT 1110 1:45\u20133:14 \ud83d\udd12 \u00b7 OIDD 2220 3:30\u20136:29 \u00b7 Climbing Club 8:30\u201310:30 (soft) \u2014 **low-ambition day by design** |\n| Wed | MGMT 3010 1:45\u20133:14 \u2192 **GOLDEN: superblock 3:30\u20138:30** (climbing wall 4:30\u20138:30 inside it) |\n| Thu | FNCE 1010 10:15\u201311:44 \u00b7 MGMT 1110 1:45\u20133:14 \ud83d\udd12 \u00b7 Climbing Club 8:30\u201310:30 (soft) |\n| Fri | FNCE recitation 10:15\u201311:14 \u00b7 DoorDash evening |\n| Sat | Quick-win batches / long skill blocks \u00b7 DoorDash evening |\n| Sun | Mass 11:30 \ud83d\udd12 \u00b7 family call after \u00b7 weekly review \u00b7 reset |\n\n**Q2 (Oct 15 \u2013 Dec 7)**: remove MGMT 3010; add MKTG 2340 MW 10:15\u201311:44 + LGST 2420 MW 12:00\u20131:29. Wednesday superblock shrinks to ~1:45\u20138:30 free after 1:29. Everything else holds.\nGym: ~6\u00d7/wk, default evening 8:00\u20139:15 slots (engine places; user drags). Legs 1\u00d7/wk \u2192 2\u00d7/wk by Oct 1.\n\n## 7. ACADEMICS MODULE\n- **F-AC1 Courses table** (seed \u00a712.1). **F-AC2** Study-hours auto-plan: `weeklyStudy(course) = cu \u00d7 3 \u00d7 multiplier`, where multiplier = 0.75 if PCR diff <2.0, 1.0 if 2.0\u20132.75, 1.5 if >2.75. **F-AC3 Self-recalibration**: after 3 weeks of logged actuals, blend multiplier 50/50 toward observed ratio (repeat monthly).\n- **F-AC4 Assignments** (~1/wk/class prompt on syllabus day), due-date list + calendar pins.\n- **F-AC5 Exams**: user enters dates when syllabi drop (seed reminder per course \"Enter [code] exam dates\" due Aug 29). Each exam gets an **exam-eve block**, default hrs by multiplier (0.75\u00d7\u21922h, 1\u00d7\u21923h, 1.5\u00d7\u21924.5h), **per-exam adjustable**. **F-AC6 Back-planning**: midterms auto-place 3 prep sessions across prior 7 days.\n- **F-AC7 Monday-night rule**: Tuesday exam \u2192 modal: \"Claim tonight 7\u201310 for study? Overrides Chess Club.\" [Study][Club + study 4\u20137]. **Ask, never auto-override.**\n- **F-AC8** Reading days (Dec 8\u20139) near-zero skill capacity; **finals windows (Dec 10\u201317, May 7\u201317) dormant mode** \u2014 skills auto-pause, no streak damage.\n- **F-AC9 GPA tracker + what-if** vs 3.8 target (4.0 scale, CU-weighted).\n- **F-AC10 Three add/drop calendars**, labeled per course: UG (add Sep 8 \u00b7 drop Oct 5 \u00b7 withdraw Nov 2), Wharton-quarter (LGST 2420 \u2014 seed task \"verify Q2 half-CU deadlines on Wharton calendar\"), MBA (MKTG 2340 \u2014 seed task \"verify MBA add/drop dates\"). Advance registration **Oct 26\u2013Nov 9** as a task with reminder.\n- **F-AC11 Semester rollover wizard** (end of finals): archive courses, import next term, carry incomplete skills, prompt new grids. Spring 2027 seed: classes Jan 20\u2013May 17? no \u2014 **Jan 20 start, spring break Mar 6\u201314, finals May 7\u201317.** Fall break Oct 1\u20134, Thanksgiving Nov 26\u201329 auto-flip to BREAK mode.\n- **F-AC12 Plumb switch task**: recurring **weekly**, starts immediately: \"Attempt switch out of LGST 2420 Plumb (2.00/2.21/1.81) \u2192 Werbach (3.31 qual) or Kshirsagar (2.79).\" Auto-retires if user marks 'switched' or after add/drop closes.\n\n## 8. IB RETURN-OFFER ENGINE\n- **F-IB1** Framing everywhere: countdown \"**X days until Sage Group Day 1 (June 2027)**.\" Copy says *return offer*, never interview prep.\n- **F-IB2 SM-2 spaced repetition, exact**: quality q\u22080\u20135 on review. If q\u22653: reps+1; interval = 1 if reps==1, 6 if reps==2, else round(prevInterval\u00d7EF). EF' = EF + (0.1 \u2212 (5\u2212q)\u00d7(0.08 + (5\u2212q)\u00d70.02)), floor 1.3. If q<3: reps=0, interval=1, EF unchanged. Due = today + interval.\n- **F-IB3 Seed decks** (empty-ish, user fills; seed 10 starter cards each): Accounting (3 statements link), Valuation (DCF/WACC/comps), EV vs Equity, LBO intuition, Markets vocab, **Excel shortcuts** (seed 25 cards: Alt+E+S+V, Ctrl+arrows, F4, Alt+=, Ctrl+Shift+L, trace precedents\u2026).\n- **F-IB4 Excel drill mode**: daily 15-min timer + shortcut deck + weekly \"no-mouse day\" challenge.\n- **F-IB5 Modeling artifacts** tracked via `modeling` skill tiers (3-stmt \u2192 DCF \u2192 comps \u2192 LBO-lite \u2192 pitch).\n- **F-IB6 Readiness score 0\u2013100** = 40% technical-deck maturity (cards seen \u22653\u00d7 and EF\u22652.0 \u00f7 target 300 cards) + 25% Excel (shortcut deck maturity + no-mouse days \u00f7 12) + 25% modeling tiers done \u00f75 + 10% mock reps logged \u00f76. Plot vs **linear pace line to June 1, 2027**; show gap honestly.\n- **F-IB7 Anki note** (settings, dismissible): \"This deck exports to CSV \u2192 real Anki (FSRS) any time. In-app SM-2 is deliberately simple.\"\n\n## 9. BODY, NUTRITION, SLEEP\n- **F-B1 Logs**: weight (chart w/ **phase bands**), lifts (bench/squat/dead + accessories), runs, gym sessions (with **\"Showered right after? \u2610\"** checkbox \u2014 see F-AP7).\n- **F-B2 Phases**: CUT \u2192 157 lb (floor adjustable to 155) \u2192 **manual flip w/ reminder** when hit \u2192 LEAN BULK toward 180 by June. **F-B3 PR suppression**: during CUT, 1RM-attempt suggestions hidden + warning if user logs one anyway.\n- **F-B4 Legs ramp**: 1\u00d7/wk now, task to make it 2\u00d7/wk by Oct 1.\n- **F-B5 Nutrition**: daily kcal/protein/carbs/fat/water logging (quick-add buttons). **Targets computed**: BMR (Mifflin-St Jeor, male) = 10\u00d7kg + 6.25\u00d7179 \u2212 5\u00d7age + 5; TDEE = BMR\u00d71.65; CUT = TDEE\u2212400, BULK = TDEE+250; protein = 0.9 g/lb (band 0.7\u20131.0 shown); water 3\u20134 L. Recompute on weight change/phase flip.\n- **F-B6 Creatine note** pinned first 3 weeks of use: \"+2\u20134 lb water is normal, not fat \u2014 the trend line matters, not the jump.\" Seed task: **buy creatine on arrival (Aug 23\u201325)**.\n- **F-B7 Plate math + warmup calculator**: target weight \u2192 per-side plates + warmup ladder (bar\u00d710, 40%\u00d75, 60%\u00d73, 80%\u00d71).\n- **F-B8 One-tap sleep logger**: [I'm in bed] / [I'm up] stamps vs 1:00/9:30 targets; adherence % weekly; sleep streak = within 30 min of target.\n- **F-B9 Wind-down nudge 12:45 AM** (in-app + .ics alarm) with **screen-free menu**: 10-min stretch (flex pack) \u00b7 plan tomorrow on paper \u00b7 read physical pages (books/Gospel tiers) \u00b7 prayer/reflection \u00b7 floss + teeth routine \u00b7 prep clothes. Rotates suggestions; not a dealbreaker if skipped \u2014 no shame copy.\n\n## 10. APPEARANCE (checklist module, each with cadence + notes)\n**F-AP1** Teeth = **course with cooldown**, not a streak: $35 strips \u2192 2-wk course \u2192 6-mo cooldown timer \u2192 maintenance; copy explains natural-shade ceiling + stain prevention (coffee via straw, rinse after). **F-AP2** SPF daily habit. **F-AP3** Cleanser + moisturizer AM/PM. **F-AP4** Adapalene 12-week arc with **week-3 pinned note**: \"purge phase is expected \u2014 do not quit\"; escalate to **Penn Student Health** if beyond mild. **F-AP5** Back/chest skin protocol. **F-AP6** Makeup tiers 1\u20134 (moisturizer\u2192tinted SPF\u2192concealer dab\u2192brow gel), milestone = \"invisible,\" ~$25 total, private. **F-AP7 (retired in v4: shower is just a schedule block)** \u2014 habit streak fed by the gym-log checkbox (F-B1); ties to back/chest skin. **F-AP8** Brows monthly. **F-AP9** Haircut every 3\u20134 wks (recurring task). **F-AP10** Nails weekly. **F-AP11** Fragrance (2 sprays, don't marinate). **F-AP12** Posture daily cue (ties to handstand/flex work). **F-AP13** Shoe care monthly. **F-AP14** Iron/steam before events. **F-AP15** Fit-over-brand + thrifting; **tailored suit chain back-planned**: thrift/outlet suit by Feb 2027 \u2192 tailor by Apr \u2192 done May 2027 (~$60\u201390 total). **F-AP16** Monthly progress photo \u2014 **private flag, hard-excluded from friend view and share cards**.\n\n## 11. MONEY, TRADING, SOCIAL/FAITH/FAMILY/CULTURE\n- **F-M1** Income streams: DoorDash, work-study (**20 hr/wk cap enforced** with warning), + seeded opportunity tasks: tutoring listing, IM referee application, lifeguard cert (skills exist). **F-M2 DoorDash analytics**: $/hr auto; **matrix by day-of-week \u00d7 hour-bucket**; mode foot vs bike compared (feeds bike decision). **F-M3** $500/mo target bar. **F-M4** $100k ladder chart: actual vs **required pace line (honest \u2014 it will show a gap until June 2027; label it)**. **F-M5** Budget slider ($20 default/$50 max) gates skill activations. **F-M6** Every purchase logs a **\"+X days to $100k\"** delta. **F-M7** Work-study application sprint seeded week 1 (apply to 5 by Aug 29).\n- **F-T1 Trading journal** per data model; **rules score** = checked items \u00f7 4. **F-T2 Unlock banner**: after 20 paper stock + 15 paper options trades with \u226580% avg score \u2192 real capital \u2264 **$50** (original $15 cap shown, both adjustable in settings). **F-T3** Paper-only enforced until unlock; P&L displayed second, score first.\n- **F-SO1** Social quota 1 event/wk, **50/50 finance-network vs general** mix meter. **F-SO2 CRM  |\nStudy load \u2248 17.5 h/wk Q1 \u00b7 19.6 h/wk Q2 (recalibrates per F-AC3).\n\n### 12.2 Academic calendar (seed both)\nFall: classes Aug 25 \u00b7 add Sep 8 \u00b7 drop Oct 5 \u00b7 fall break Oct 1\u20134 \u00b7 **Q2 starts Oct 15** \u00b7 advance reg Oct 26\u2013Nov 9 \u00b7 withdraw Nov 2 \u00b7 Thanksgiving Nov 26\u201329 \u00b7 reading Dec 8\u20139 \u00b7 finals Dec 10\u201317. Spring: classes Jan 20 \u00b7 break Mar 6\u201314 \u00b7 finals May 7\u201317.\n\n### 12.3 Reminders to seed\nWeekly Plumb-switch (from Aug 20) \u00b7 **Sun Aug 23 9:00 AM: pack jump rope, deck of cards, origami paper, camera + final bike call** \u00b7 buy creatine on arrival \u00b7 Aug 29: work-study apps \u00d75 done \u00b7 Aug 29: enter exam dates per syllabus (\u00d77) \u00b7 Sun Aug 30: 9 pm Mass check \u00b7 verify WQ + MBA add/drop dates \u00b7 Oct 8: \"Q2 swap in 7 days\" \u00b7 advance reg Oct 26 \u00b7 haircut every 3\u20134 wks \u00b7 monthly photo (1st) \u00b7 teeth cooldown timer \u00b7 adapalene wk-3 note (on start) \u00b7 suit chain (Feb/Apr/May 2027) \u00b7 legs\u21922\u00d7 by Oct 1 \u00b7 Anki-export note (once) \u00b7 family call Sundays.\n\n### 12.4 Badges (seed ~18)\nFirst Blood (first tier done) \u00b7 Quick Five (5 quick-wins in a day) \u00b7 Wall Rat (10 climb sessions) \u00b7 Iron Month (24 gym/30d) \u00b7 Clean Sweep (all dailies 7d) \u00b7 Sofrito (10 Spanish hrs) \u00b7 Deadline Zero (month, no late work) \u00b7 Golden Wednesday (4 superblocks used) \u00b7 Benjamin ($500 month) \u00b7 Ladder 1 ($1k saved) \u00b7 Sunday Regular (4 Masses) \u00b7 Blood Line (8 family calls) \u00b7 Curator (30 albums) \u00b7 Projector (3 movies) \u00b7 Deca (10 tiers done) \u00b7 Q-Crosser (survive Oct 15 swap) \u00b7 Freeze-Free (month, no freezes) \u00b7 Comeback (finish recovery mode).\n\n### 12.5 Reflection prompts (seed ~14, data-triggered)\n\"You logged X climb sessions but grade stuck at Vy \u2014 time, method, or fingers?\" \u00b7 \"Sleep adherence Z% this week; which night broke it?\" \u00b7 \"3 Tuesdays with zero output \u2014 accept Tuesday as recovery or fight it?\" \u00b7 \"$N this month vs $500 \u2014 which stream moves first?\" \u00b7 \"FNCE actuals 2\u00d7 plan \u2014 recalibrate or change method?\" \u00b7 \"Streak survived on a freeze \u2014 what happened Thursday?\" \u00b7 \"4 weeks, no social event logged \u2014 pick one for this week now?\" \u00b7 \"Album streak alive but all during gym \u2014 the pairing order says gym last; why?\" \u00b7 \"You said return offer \u2014 did this week's IB hours agree?\" \u00b7 \"Recovery mode ended \u2014 what's the one thing you'll do differently?\" \u00b7 \"Cut hit 157 \u2014 flip to bulk or hold?\" \u00b7 \"Readiness score below pace line 2 wks \u2014 smallest fix?\" \u00b7 \"Weekly challenge skipped twice \u2014 too hard or wrong kind?\" \u00b7 \"It's been 30 days \u2014 show mom & sister something.\"\n\n### 12.6 Movie seed list (~20)\nShawshank \u00b7 The Godfather \u00b7 12 Angry Men \u00b7 Casablanca \u00b7 Rocky (Philly!) \u00b7 Moneyball \u00b7 The Big Short \u00b7 Margin Call \u00b7 Catch Me If You Can \u00b7 Apollo 13 \u00b7 Schindler's List \u00b7 Goodfellas \u00b7 Back to the Future \u00b7 Dead Poets Society \u00b7 Whiplash \u00b7 The Social Network \u00b7 Interstellar \u00b7 Spotlight \u00b7 Hidden Figures \u00b7 Ford v Ferrari.\n\n### 12.7 Training-conflict pairs (F-S4b)\ncut \u27f7 1RM attempts \u00b7 heavy pull day \u27f7 climbing (<24h) \u00b7 heavy legs \u27f7 sprint work (<48h) \u00b7 long run \u27f7 heavy legs (<48h) \u00b7 10k-rope day \u27f7 calf-heavy anything (next day) \u00b7 breath-hold table \u27f7 cold immersion (same session \u2014 never combine).\n\n### 12.8 Safety gates (settings toggles, off by default, each with honest copy)\nsupervision: **backflip, gainer, wall flip** (venue = Gymnastics Club) \u00b7 **chess boxing** \u00b7 **handbrake turn** (closed course). dry-only: **breath-hold \u2014 any water attempt permanently locked behind \"trained supervisor present\" toggle; shallow-water-blackout warning text included.** paper-only: trading until F-T2. Eating challenges ungated by choice, but \"never speed-eat alone\" note stays.\n\n### 12.9 First 30 days (seed as plan)\n**Wk 1 gentle (Aug 25\u201331):** sleep anchor \u00b7 gym re-establish (+shower-after checkbox live) \u00b7 Spanish + album dailies start \u00b7 creatine bought \u00b7 Mass Aug 30 + 9pm check \u00b7 quick-win batch #1 Sat (3 tie knots, presidents started, crane) \u00b7 Plumb attempt \u00b7 climbing wall intro (opens Aug 25) \u00b7 activities fair \u2014 join 2\u20133 max (Chess, Climbing, Gymnastics) \u00b7 work-study apps \u00d75. **Sept 1+ aggressive:** Wednesday superblock live (climb 4:30\u20138:30 inside) \u00b7 roster locked: dailies Spanish + album; projects climbing, cube, typing, chess \u00b7 DoorDash Fri/Sat \u00b7 IB decks daily 15 min \u00b7 first weekly review Sun Sept 7.\n\n### 12.10 Penn resources table (render in a Resources view)\nPottruck climbing FREE M,W\u2013F 4:30\u20138:30 / Tu 5:30\u20138:30 (rentals free; 101 $20 opt) \u00b7 Climbing Club Tu/Th 8:30\u201310:30 \u00b7 Chess Club Mon 8\u201310 Houston Hall \u00b7 Gymnastics Club (flips venue) \u00b7 pianos FREE (Fisher-Bennett 403/405/414, Music 204\u2013208, PennKey) \u00b7 Sheerr Pool \u00b7 ergs/bags/courts at Pottruck \u00b7 Table Tennis, XCTF, Ski/Snowboard, Figure Skating, VOID Ultimate, Swim, TKD/Karate/Judo, Squash, Roundnet, Juggling clubs (free) \u00b7 1923 Rink $8+$5 \u00b7 Outdoor rentals cheap (48h lead) \u00b7 St. Agatha\u2013St. James 9/11:30/5:30 (+9pm TBD) \u00b7 IM leagues + Competitive-Sports employment \u00b7 work-study 20 hr cap.\n\n## 13. GAMIFICATION, REFLECTION, SPEC TAB\n- **F-G1 Radar** 6 axes (A/M/C/Mo/S/F), score = weighted tier completions + streak health, redraw weekly snapshot (history kept). **F-G2 Heatmap** (GitHub-style, any logged effort). **F-G3 Rings** (daily: Spanish, album, sleep, gym-or-rest, IB-15min). **F-G4** Weight chart w/ band  `active-daily` + 4 `active`, enforced with swap dialog**.\n\n## 14. BUILD ORDER\n1. Shell: nav, theme, PIN gate, storage layer, schema+migrate, import `mettle-skills.json`.\n2. Schedule engine + grids + calendar views + .ics export.\n3. Skills module complete (states, gates, roster, playbooks, decay, evidence, roulette, batches, diagnostics).\n4. Academics (courses, multipliers, assignments/exams, back-planning, three calendars, rollover).\n5. Body/nutrition/sleep (+shower checkbox) + appearance module.\n6. Money + trading + budget gating.\n7. Social/CRM/faith/family/culture + friend share-card.\n8. Gamification + charts + streaks/recovery + reflection + weekly review.\n9. Settings + Spec tab + export/import + reminders/.ics wiring.\n10. QA pass: run Acceptance Checklist, print results.\n\n## 15. ACCEPTANCE CHECKLIST (print pass/fail)\n1 Single file opens offline \u00b7 2 PIN gate works, hash stored \u00b7 3 Refresh persists (localStorage) \u00b7 4 Export\u2192wipe\u2192import = identical state \u00b7 5 Unknown JSON fields survive round-trip \u00b7 6 Skills JSON imported: **count matches file**, playbooks render \u00b7 7 Roster cap blocks a 5th project with swap dialog \u00b7 8 Supervision toggle required before backflip activates \u00b7 9 Breath-hold water tier shows locked w/ warning \u00b7 10 Trading real-entry blocked pre-criteria; unlock math right \u00b7 11 Budget slider blocks over-budget activation \u00b7 12 Oct 15 swap banner + grid change fires (test via date override) \u00b7 13 Hours-remaining matches hand calc for seed week \u00b7 14 Drop-in event re-plans + flags displacement \u00b7 15 Cut\u27f7PR conflict fires \u00b7 16 \"Right now\" filter respects minutes+location+equipment \u00b7 17 MGMT 1110 immovable in re-plans \u00b7 18 Monday-night modal on Tue exam \u00b7 19 Exam-eve default hrs match multiplier + editable \u00b7 20 FNCE weekly study = 4.5h seed \u00b7 21 Recalibration adjusts after 3 wks logged actuals \u00b7 22 GPA what-if math correct \u0 hain (laundry, biweekly sheets, room, bathroom, 15m admin sweep), daily 10m texts block, and free blocks carrying a no-reels menu. NOW card + full-screen NOW mode with Done / Swap / +15 / Skip and reshuffle-rest-of-day. Weekly template editor (per day, per mode) persists as tplEdits. Roadmap view sequences the entire skill catalog with projected dates at ~8h/wk. Flashcards are tap-to-flip cards with browse mode. Global Undo (12 snapshots). Water ring 3x40oz. Sleep targets shift to 2:00/10:30 on out nights. ICS covers 28 days, alarm at block start, designed for a subscribed-calendar URL in the GitHub repo. Birthday fixed 2005-11-08. (Archive: everything above describes the v1 design. Live behavior is the v4 rebuild: real class grid, 6-day night-gym split, dash on foot after the lift, climbing Tuesdays 8:00, no chess club, no shower streak, tabs auto-fed from Today.) Changelog: v1 initial, v2 autopilot, v3 roadmap + deep links, v4 real class grid + night gym + sync.";

{id:'acct',name:'Accounting / 3 Statements',cards:[['Walk me through the 3 statements.','IS: revenue→net income. CF: NI + non-cash ± WC ± investing/financing → Δcash. BS: cash flows in; NI→retained earnings; must balance.'],['$10 depreciation ↑  -  walk through (40% tax).','IS: pretax −10, NI −6. CF: NI −6 +10 D&A = +4 cash. BS: PP&E −10, cash +4 → assets −6; RE −6. Balances.'],['Link net income to the balance sheet.','Net income → retained earnings (equity), and via CF into cash.'],['Cash vs accrual?','Accrual recognizes revenue when earned, cost when incurred; cash when money moves.'],['Deferred revenue?','Cash received before earning it  -  a liability until delivered.'],['Working capital?','Current assets − current liabilities; ΔNWC uses cash when it grows.'],['Where does D&A show up?','IS (expense, maybe in COGS), CF (add-back), BS (accumulated depreciation ↓PP&E).'],['Inventory ↑ $20, paid cash?','CF: −20 in WC. BS: inventory +20, cash −20. IS: nothing until sold.'],['Why can profitable firms go bankrupt?','Cash timing  -  receivables, debt maturities. Cash pays bills, not net income.'],['Goodwill?','Purchase price above fair value of net identifiable assets; tested for impairment, not amortized (US GAAP).']]},
{id:'val',name:'Valuation / DCF',cards:[['3 main valuation methods?','Comps (relative), precedent transactions (relative + control premium), DCF (intrinsic).'],['Walk me through a DCF.','Project 5-10y unlevered FCF → discount at WACC → terminal value (Gordon or exit multiple) → discount → enterprise value → bridge to equity.'],['Unlevered FCF formula?','EBIT×(1−t) + D&A − CapEx − ΔNWC.'],['WACC?','E/V·Re + D/V·Rd·(1−t). Re via CAPM: rf + β×ERP.'],['Gordon terminal value?','FCF·(1+g)/(WACC−g), g ≈ 2-3% (≤ long-run GDP).'],['Higher WACC → value?','Lower  -  cash flows discounted harder.'],['Why unlever/relever beta?','Strip peers\u2019 capital structure, apply target\u2019s: βU=βL/(1+(1−t)D/E).'],['When is DCF weak?','Unpredictable FCF, early-stage, banks (use DDM), heavy TV dependence.'],['Sensitivity tables?','WACC × growth grid on value  -  shows dependence honestly.'],['Exit multiple vs Gordon?','Multiple ties TV to market comps; Gordon ties to fundamentals; cross-check both.']]},
{id:'evq',name:'EV vs Equity / Multiples',cards:[['Enterprise value?','Value of core operations to all capital: equity + net debt + preferred + minority interest.'],['EV → equity bridge?','EV − net debt − preferred − minority + (sometimes) investments = equity value.'],['Why EV/EBITDA over P/E?','Capital-structure and D&A neutral; comparable across leverage.'],['Cash ↑ $100: EV? Equity?','Equity +100; EV unchanged (net debt −100).'],['Which pairs with revenue?','EV/Revenue  -  revenue is pre-interest, belongs to all capital.'],['P/E?','Price per share ÷ EPS; equity-holder metric, after interest.'],['Diluted shares?','Basic + in-the-money options (treasury stock method) + converts.'],['Negative EV?','Cash exceeds market cap + debt  -  market pricing decline or distress.'],['EBITDA flaws?','Ignores CapEx, WC, taxes  -  \u201cbad proxy for cash flow\u201d (Buffett/Munger).'],['Minority interest in EV?','Consolidated financials include 100% of sub  -  add MI so numerator matches denominator.']]},
{id:'lbo',name:'LBO Intuition',cards:[['What is an LBO?','Buy company with heavy debt, use its cash flows to pay it down, sell in ~5y  -  equity returns amplified by leverage.'],['3 return drivers?','Debt paydown, EBITDA growth, multiple expansion.'],['Ideal LBO target?','Stable cash flows, low CapEx, strong margins, clean balance sheet, exit paths.'],['Why does leverage boost IRR?','Smaller equity check up front; debt is cheaper than equity and interest is deductible.'],['Rule of thumb IRR?','~20%+ target; doubling equity in 5y ≈ 15% IRR, tripling ≈ 25%.'],['Sources & uses?','Sources: debt tranches + sponsor equity. Uses: purchase equity, refinance debt, fees.'],['What kills an LBO?','EBITDA decline + fixed debt service  -  leverage cuts both ways.'],['Dividend recap?','Issue new debt mid-hold to pay sponsor a dividend  -  returns cash early, adds risk.'],['Why max leverage isn\u2019t always best?','Covenants, interest coverage, downside room; rate environment matters.'],['Exit options?','Sale to strategic, secondary buyout, IPO.']]},
{id:'mkts',name:'Markets & Deal Vocab',cards:[['Accretion/dilution?','Does the deal raise or lower acquirer EPS  -  compare earnings yield bought vs cost of funding.'],['Synergies?','Cost (real, credible) vs revenue (discounted by everyone).'],['10-K vs 10-Q?','Annual audited vs quarterly unaudited SEC filings.'],['Bond price vs rates?','Inverse  -  duration measures sensitivity.'],['Yield curve inversion?','Short rates above long  -  classic recession signal.'],['Bid/ask?','Highest buyer vs lowest seller; spread = liquidity cost.'],['Short selling?','Borrow, sell, hope to rebuy lower; losses unbounded.'],['Market vs limit order?','Speed vs price control.'],['Call option?','Right, not obligation, to buy at strike by expiry.'],['Fed funds rate?','Overnight interbank rate the Fed targets; anchors everything else.']]},

{id:'ib400',name:'IB Core (400Q-style)',cards:[['Two main valuation approaches?','Intrinsic (DCF) and relative (trading comps, precedent transactions).'],['Enterprise Value formula.','Equity value + net debt + preferred + minority interest.'],['EV vs equity value: which pairs with EBITDA and why?','EV, because EBITDA accrues to all capital providers, so numerator and denominator must match claimants.'],['Why EV/EBITDA over P/E for comparing firms?','Capital-structure and D&A neutral, so it compares core operations across different leverage and asset bases.'],['Walk me through a DCF.','Project 5-10y unlevered FCF, discount at WACC, add discounted terminal value to get EV, bridge to equity, divide by shares.'],['Unlevered FCF formula.','EBIT x (1 - t) + D&A - capex - increase in NWC.'],['Two terminal value methods.','Gordon growth: FCF x (1+g)/(WACC - g). Exit multiple: terminal EBITDA x multiple.'],['WACC formula.','E/V x cost of equity + D/V x cost of debt x (1 - t).'],['Cost of equity via CAPM.','Risk-free rate + beta x equity risk premium.'],['Why unlever then relever beta?','Strip peer capital structure to isolate asset risk, then apply the target company leverage.'],['What makes a good LBO candidate?','Stable cash flows, low capex, strong margins, room to delever, credible exit.'],['Three drivers of LBO returns.','EBITDA growth, multiple expansion, debt paydown.'],['Why does leverage amplify PE returns?','Smaller equity check up front; the company pays down debt with its own cash, so exit equity captures the value gain.'],['Accretion/dilution rule of thumb, all-stock deal.','Acquirer P/E above target P/E is accretive; below is dilutive.'],['Depreciation up $10, 40% tax: NI and cash?','Net income falls $6; cash rises $4 since the $10 add-back beats the tax hit.'],['Deferred revenue: where and why?','Liability. Cash collected for an undelivered obligation; recognized as revenue when earned.'],['Why can negative working capital be good?','Customers fund operations:
